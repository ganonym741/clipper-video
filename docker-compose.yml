services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: clipper-studio:local
    command: bun run start
    env_file:
      - .env
    ports:
      - "3999:3999"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  worker:
    image: clipper-studio:local
    build:
      context: .
      dockerfile: Dockerfile
    command: bun run worker
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    depends_on:
      - web

  migrate:
    image: clipper-studio:local
    build:
      context: .
      dockerfile: Dockerfile
    command: bun run db:apply
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    profiles:
      - tools

  doctor:
    image: clipper-studio:local
    build:
      context: .
      dockerfile: Dockerfile
    command: bun run doctor
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    profiles:
      - tools
