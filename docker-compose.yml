x-app-build: &app-build
  context: .
  dockerfile: Dockerfile

x-app-environment: &app-environment
  DATABASE_URL: ${DATABASE_URL}
  REDIS_URL: ${REDIS_URL}
  RUSTFS_ENDPOINT: ${RUSTFS_ENDPOINT}
  RUSTFS_REGION: ${RUSTFS_REGION:-us-east-1}
  RUSTFS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY_ID}
  RUSTFS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_ACCESS_KEY}
  RUSTFS_BUCKET: ${RUSTFS_BUCKET:-clipper-studio}
  RUSTFS_FORCE_PATH_STYLE: ${RUSTFS_FORCE_PATH_STYLE:-true}
  RUSTFS_PUBLIC_BASE_URL: ${RUSTFS_PUBLIC_BASE_URL:-}
  GEMINI_API_KEY: ${GEMINI_API_KEY}
  GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.7-flash}
  FFMPEG_PATH: ${FFMPEG_PATH:-ffmpeg}
  YTDLP_PATH: ${YTDLP_PATH:-yt-dlp}
  APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3999}
  NODE_ENV: production

services:
  web:
    build: *app-build
    command: bun run start
    environment: *app-environment
    ports:
      - "3999:3999"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  worker:
    build: *app-build
    command: bun run worker
    environment: *app-environment
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    depends_on:
      - web

  migrate:
    build: *app-build
    command: bun run db:apply
    environment: *app-environment
    extra_hosts:
      - "host.docker.internal:host-gateway"
    profiles:
      - tools

  doctor:
    build: *app-build
    command: bun run doctor
    environment: *app-environment
    extra_hosts:
      - "host.docker.internal:host-gateway"
    profiles:
      - tools
